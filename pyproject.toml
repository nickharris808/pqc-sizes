[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-sizes"
version = "0.1.0"
description = "Post-quantum object sizes, fragmentation counts, and the two-sided reassembly window."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PQC Migration Safety Lab" }]
keywords = ["post-quantum", "ML-KEM", "ML-DSA", "fragmentation", "MTU", "reassembly", "IoT"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
pqc-sizes = "pqc_sizes.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/pqc-sizes"
Issues = "https://github.com/nickharris808/pqc-sizes/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.setuptools.package-data]
pqc_sizes = ["py.typed"]
